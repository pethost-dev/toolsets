# Publishes a tagged version of the TypeScript package, typescript/, to npm as pethost-toolsets.
#
# This repository is a copy: Pethost's own repository holds the source and pushes it here with a
# tag, typescript/v<version>, when the version changes. Nothing here is edited by hand but the
# workflows, which are placed by hand.
# npm takes the release by trusted publishing, with its provenance: no token is kept anywhere.
#
# By hand (workflow_dispatch) it publishes what main holds: for a tag whose own run failed on
# this file as it then was, since a run again reads the file of the tag's commit.
name: TypeScript

on:
  push:
    tags: ['typescript/v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: typescript

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # Its npm publishes by trusted publishing.
          registry-url: https://registry.npmjs.org
      - run: npm install --no-package-lock
      - run: npm run check
      # prepack builds dist/.
      - run: npm publish --access public
